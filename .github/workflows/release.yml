name: Release

on:
  # Manual trigger only - no automatic runs
  workflow_dispatch:
    inputs:
      web:
        description: 'Release Web/Server?'
        required: true
        type: boolean
        default: true
      # Desktop and Mobile inputs disabled - jobs are commented out
      # desktop:
      #   description: 'Release Desktop?'
      #   required: true
      #   type: boolean
      #   default: false
      # mobile:
      #   description: 'Release Mobile?'
      #   required: true
      #   type: boolean
      #   default: false
      # ios-app-version:
      #   description: 'iOS App Store Version (Optional, use tag version if empty)'
      #   required: false
      #   type: string

permissions:
  contents: write
  pull-requests: write
  actions: write
  id-token: write
  packages: write
  security-events: write
  attestations: write
  issues: write

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    outputs:
      APP_VERSION: ${{ steps.prepare.outputs.APP_VERSION }}
      GIT_SHORT_HASH: ${{ steps.prepare.outputs.GIT_SHORT_HASH }}
      BUILD_TYPE: ${{ steps.prepare.outputs.BUILD_TYPE }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Release
        id: prepare
        uses: ./.github/actions/prepare-release

  cloud:
    name: Release Cloud
    if: ${{ inputs.web }}
    needs:
      - prepare
    uses: ./.github/workflows/release-cloud.yml
    secrets: inherit
    with:
      build-type: ${{ needs.prepare.outputs.BUILD_TYPE }}
      app-version: ${{ needs.prepare.outputs.APP_VERSION }}
      git-short-hash: ${{ needs.prepare.outputs.GIT_SHORT_HASH }}

  image:
    name: Release Docker Image
    runs-on: ubuntu-latest
    needs:
      - prepare
      - cloud
    steps:
      # Manual approval removed for fork - not needed for self-hosted deployment
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          logout: false
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Tag Image
        run: |
          IMAGE_NAME="${GITHUB_REPOSITORY,,}"
          docker buildx imagetools create --tag ghcr.io/${IMAGE_NAME}:${{needs.prepare.outputs.BUILD_TYPE}} ghcr.io/${IMAGE_NAME}:${{needs.prepare.outputs.BUILD_TYPE}}-${{needs.prepare.outputs.GIT_SHORT_HASH}}
          docker buildx imagetools create --tag ghcr.io/${IMAGE_NAME}:${{needs.prepare.outputs.APP_VERSION}} ghcr.io/${IMAGE_NAME}:${{needs.prepare.outputs.BUILD_TYPE}}-${{needs.prepare.outputs.GIT_SHORT_HASH}}

  # Desktop and Mobile releases disabled for selfhosted deployment - saves build time
  # desktop:
  #   name: Release Desktop
  #   if: ${{ inputs.desktop }}
  #   needs:
  #     - prepare
  #   uses: ./.github/workflows/release-desktop.yml
  #   secrets: inherit
  #   with:
  #     build-type: ${{ needs.prepare.outputs.BUILD_TYPE }}
  #     app-version: ${{ needs.prepare.outputs.APP_VERSION }}
  #     git-short-hash: ${{ needs.prepare.outputs.GIT_SHORT_HASH }}

